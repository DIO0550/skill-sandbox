# 許可リスト方式のフォワードプロキシ。キャッシュはしない。

http_port 3128

acl allowed_domains dstdomain "/etc/squid/allowlist.txt"
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
acl localhost_mgr src 127.0.0.1/32

# ヘルスチェック用（コンテナ内からのみ）
http_access allow localhost_mgr manager
http_access deny manager

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all

# 拒否も許可もすべて docker compose logs egress-proxy で見える
logformat sandbox %{%Y-%m-%dT%H:%M:%S}tl %>a %Ss/%>Hs %rm %ru %<A %st
access_log stdio:/dev/stdout sandbox
cache_log stdio:/dev/stderr
logfile_rotate 0

cache deny all
cache_mem 0 MB
pid_filename none
coredump_dir /tmp
pinger_enable off

# クライアント情報をアップストリームに渡さない
forwarded_for delete
via off
httpd_suppress_version_string on
